<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shared Notes</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
    <!--<link rel="stylesheet" href="style.css">-->
    <style>
        *{
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
html{
  
}
body {
  background-color: black;
  font-family: Arial, Helvetica, sans-serif;
}
#app {
  
}
#upbar {
  background-color: darkgray;
  display: flex;
  position: fixed;
  top: 0;
  height: 75px;
  width: 100%;
}
.material-icons {
  font-size: 40px;
  margin-top: 10px;
  height: 55px;
  width: 55px;
  border-radius: 10px;
  background-color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 10px;
}
.material-icons::before{
  content:attr(data-icon);
}
#actualiserbtn{
  position: fixed;
  right: 10px;
}
#butons{
  display: flex;
}
#title {
  margin: auto 20px;
}

main{
  margin-top: 75px;
  height: calc(100vh - 75px);
  padding: 5px 10px;
}
#textDiv{
  height: 100%;
  position: fixed;
  top: 80px;
  right: 5px;
  left: 5px;
}
textarea{
  resize: none;
  height: calc(100% - 85px);
  width: 100%;
  border-radius: 5px;
  padding: 5px;
}

/* Keep the same visual appearance when the textarea is disabled (override browser default graying) */
textarea:disabled,
textarea[disabled]{
  /* ensure full opacity */
  opacity: 1;
  /* match the enabled state colors */
  background-color: black;
  color: white;
  /* WebKit-specific to ensure text color isn't forced */
  -webkit-text-fill-color: white;
  /* cursor and selection behavior */
  cursor: default;
  border: solid white 2px;
}

/* Optional: keep placeholder color readable */
textarea::placeholder{
  color: #888;
}

@media(max-width: 570px){
  #title{
    width: 110px
  }
}
@media(max-width: 480px){
  .material-icons{
    margin: 10px 0 0 10px;
  }
}
@media(max-width: 420px){
  .material-icons{
    height: 40px;
    width: 40px;
    font-size: 20px;
    margin-top: 20px;
  }
}
@media (max-width: 370px){
  #title{
    width: 70px;
    font-size: 12px
  }
}
@media(max-width: 330px){
  .material-icons{
    margin-top: 20px;
    height: 30px;
    width: 30px;
  }
}
@media(max-width: 305px){
   #upbar{
    height: 100px;
    display: block;
  }
  html{
    height: 100%;
  }
  body{
    height: 100%;
  }
  #title{
    width: 150px;
    margin: 10px auto 0;
  }
  #butons{
    display: flex;
    justify-content: center;
    margin-top: 10px;
  }
  #actualiserbtn{
    position: static;
    margin-top: 10px;
  }
  .material-icons{
    margin: 10px 0 0 15px;
  }
  #app{
    height: 100%;
  }
  main{
    margin-top: 100px;
    height: 100%;
  }
  #textDiv{
    position: static;
    margin-top: 10px;
    height: 100%
  }
  textarea{
    height: 100%;
  }
  main{
    height: 100%;
  }
  body{
    height: 75%;
  }
}
@media(max-width: 239px){
  *{
    display: none;
  }
        }
    </style>
</head>
<body>
    <div id="app">
        <header>
            <div id="upbar">
                <div id="title">
                    <h1>
                        shared notes
                    </h1>
                </div>
                <div id="butons">
                    <div id="save">
                        <span class="material-icons" data-icon="save" id="savebtn"></span>
                    </div>
                    <div id="edit">
                        <span class="material-icons" data-icon="edit" id="editbtn"></span>
                    </div>
                    <div id="synchro">
                        <span class="material-icons" data-icon="cloud_done" id="synchrobtn"></span>
                        <!--<span class="material-icons" data-icon="cloud_off"></span>
                        <span class="material-icons" data-icon="cloud_download"></span>-->
                    </div>
                    <div id="actualiser">
                        <span class="material-icons" data-icon="refresh" id="actualiserbtn"></span>
                    </div>
                </div>

            </div>
        </header>
        <main>
            <div id="textDiv">
                <textarea id="noteArea" placeholder="Écris ici..."></textarea>
            </div>
        </main>
    </div>
    <script type="module"> 
        // Import the functions you need from the SDKs you need 
        import { initializeApp } 
        import { getFirestore, doc, setDoc, getDoc }
        from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js"; 
        // TODO: Add SDKs for Firebase products that you want to use 
        // https://firebase.google.com/docs/web/setup#available-libraries 
        // Your web app's Firebase configuration 
        const firebaseConfig = localStorage.getItem('APIKey', APIKey);
        // Initialize Firebase 
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
    </script>
    <script>
        async function save(){
            const noteArea = document.getElementById('noteArea');
            const noteContent = noteArea.value;
            if (noteContent.includes('API-Key')){
                const APIKey = prompt("Clé d'API");
                localStorage.setItem('APIKey', APIKey);
            } else {
                const synchro = document.getElementById('synchrobtn');
                synchro.dataset.icon = 'cloud_download';
                await setDoc(doc(db, "notes", "shared"), {
                    content: noteContent
                });
                // Use the boolean property to reliably disable the textarea
                noteArea.disabled = true;
                setTimeout(() => {
                    synchro.dataset.icon = 'cloud_done';
                }, 300);
            }     
        }
        function edit(){
            const noteArea = document.getElementById('noteArea');
            // Re-enable via the boolean property
            noteArea.disabled = false;
            noteArea.focus();
            const synchro = document.getElementById('synchrobtn');
            synchro.dataset.icon = 'cloud_off';
        }
        async function refresh(){
            const synchro = document.getElementById('synchrobtn');
            synchro.dataset.icon = 'cloud_download';
            const docRef = doc(db, "notes", "shared");
            const docSnap = await getDoc(docRef);
            const noteArea = document.getElementById('noteArea');
            if (docSnap.exists()) {
                noteArea.value = docSnap.data().content;
                noteArea.disabled = true;
                synchro.dataset.icon = 'cloud_download';
                setTimeout(() => {
                    synchro.dataset.icon = 'cloud_done';
                }, 300);
            }
        }
        document.getElementById('savebtn').addEventListener('click', save);
        document.getElementById('editbtn').addEventListener('click', edit);
        document.getElementById('actualiserbtn').addEventListener('click', refresh);
        window.onload = refresh;
    </script>
</body>
</html>
